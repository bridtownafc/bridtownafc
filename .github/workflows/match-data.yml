# Scheduled match-data sync for production (inactive until the repository is on GitHub and
# the secrets below are set). Mirrors scripts/matches/scheduler.mjs:
#   matchdays (Sat, Tue, Wed) 11:00 to 22:45 UTC every 15 minutes, which covers 12:00 to 23:00
#   UK time in both GMT and BST; otherwise every 6 hours.
# Each run fetches each team's source, keeps the last good data if a source fails, commits
# src/data/matches/*.json when what the website shows has changed, and calls the hosting
# provider's deploy hook so the rebuilt site goes live.
# Secrets: FWP_API_KEY, FWP_TEAM_ID, FWP_COMPETITION_ID (Football Web Pages), DEPLOY_HOOK_URL (hosting provider).
name: Match data

on:
  schedule:
    - cron: '*/15 11-22 * * 2,3,6'
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: match-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Sync fixtures, results and tables
        id: sync
        env:
          FWP_API_KEY: ${{ secrets.FWP_API_KEY }}
          FWP_TEAM_ID: ${{ secrets.FWP_TEAM_ID }}
          FWP_COMPETITION_ID: ${{ secrets.FWP_COMPETITION_ID }}
        run: |
          set +e
          node scripts/matches/sync.mjs | tee sync.log
          status=${PIPESTATUS[0]}
          echo "changed=$(sed -n 's/^CHANGED=//p' sync.log)" >> "$GITHUB_OUTPUT"
          # A failed source is recorded in the snapshot and shown on the site; it does not fail the job.
          exit 0
      - run: npm test
      - name: Commit changed match data
        if: steps.sync.outputs.changed != ''
        run: |
          git config user.name "match-data bot"
          git config user.email "match-data-bot@users.noreply.github.com"
          git add src/data/matches/*.json
          git commit -m "Update match data (${{ steps.sync.outputs.changed }})" && git push
      - name: Rebuild the website
        if: steps.sync.outputs.changed != '' || github.event.schedule == '0 */6 * * *'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then curl -fsS -X POST "$DEPLOY_HOOK_URL"; else echo "DEPLOY_HOOK_URL not set; skipping deploy"; fi
